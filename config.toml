# Envela CASMI 2026 - Molecule ID From Mass Spectra
# Kaggle competition worktree configuration.

[competition]
slug = "envela-CASMI26-molecule-id-mass-spectra"
name = "Envela CASMI 2026 - Molecule ID From Mass Spectra"
url = "https://www.kaggle.com/competitions/envela-CASMI26-molecule-id-mass-spectra"

[deadlines]
start = "2026-09-14"
entry = "2026-12-07"
final = "2026-12-14"

[prizes]
