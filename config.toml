# Enveda CASMI 2026 - Molecule ID From Mass Spectra
# 改善ループ設定ファイル

[competition]
slug = "enveda-CASMI26-molecule-id-mass-spectra"
name = "Enveda CASMI 2026 - Molecule ID From Mass Spectra"
url = "https://www.kaggle.com/competitions/enveda-CASMI26-molecule-id-mass-spectra"
entry_deadline = "2026-12-07"
final_deadline = "2026-12-14"

[metric]
name = "MRR@25"
description = "Mean Reciprocal Rank @ 25"

[data]
train_file = "data/train.parquet"
test_file = "data/test.parquet"
sample_submission = "data/sample_submission.csv"

[feature]
peak_features = "scripts/features/peak_features.py"
molecule_features = "scripts/features/molecule_features.py"
fusion_features = "scripts/features/fusion_features.py"

[model]
baseline = "scripts/train/baseline.py"

[validation]
mrr25 = "scripts/validate/mrr25.py"

[submit]
generate = "scripts/submit/generate.py"

[output]
features_dir = "features"
models_dir = "models"
outputs_dir = "outputs"
results_dir = "results"
logs_dir = "logs"
